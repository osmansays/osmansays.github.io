<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Svenska YKI · Practice</title>
<meta name="description" content="Interactive practice for Swedish Lessons 1–6 (YKI prep)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%239b1f45%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22 font-weight=%22bold%22>S</text></svg>">
<style>:root{
  --bg:#faf6f4; --card:#ffffff; --card2:#f6f0ee; --ink:#211a1d; --mute:#6f6569; --line:#eadfe2;
  --brand:#9b1f45; --brand2:#c2335f; --brandsoft:#f8e3ea;
  --ok:#23845a; --oksoft:#dff3e8; --bad:#cf3c3c; --badsoft:#fbe3e1; --warn:#b7791f; --warnsoft:#fbf0d9;
  --en:#2f6fb5; --ensoft:#deebf8; --ett:#b8860b; --ettsoft:#fbf0d2;
  /* sentence slot colours (same everywhere) */
  --sF:#f6d7e1; --sFi:#7a1535;
  --sV:#9b1f45; --sVi:#ffffff;
  --sS:#d9e7f7; --sSi:#1d4f8a;
  --sN:#e6ddf6; --sNi:#553094;
  --sV2:#fbe7c2; --sV2i:#7a5410;
  --sO:#d8efdf; --sOi:#1e6b40;
  --sP:#e9e9ec; --sPi:#44444c;
  --shadow:0 1px 2px rgba(40,10,20,.06),0 4px 14px rgba(40,10,20,.06);
  --r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17131a; --card:#221c25; --card2:#2a2330; --ink:#f3edf1; --mute:#b3a8b0; --line:#3a3040;
  --brand:#e0527d; --brand2:#f07a9d; --brandsoft:#3b1f2b;
  --ok:#4cc38a; --oksoft:#173528; --bad:#ff6b6b; --badsoft:#3d1f22; --warn:#e6b450; --warnsoft:#3a2f18;
  --en:#6aa8f0; --ensoft:#1c2c40; --ett:#e3b440; --ettsoft:#3a3016;
  --sF:#4a2233; --sFi:#ffc9da; --sV:#e0527d; --sVi:#1a0d12; --sS:#1f3350; --sSi:#b8d6ff;
  --sN:#33284d; --sNi:#d8c8ff; --sV2:#4a3914; --sV2i:#ffe0a3; --sO:#1d3b2a; --sOi:#b4ecc9; --sP:#33333b; --sPi:#dadae2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#17131a; --card:#221c25; --card2:#2a2330; --ink:#f3edf1; --mute:#b3a8b0; --line:#3a3040;
  --brand:#e0527d; --brand2:#f07a9d; --brandsoft:#3b1f2b;
  --ok:#4cc38a; --oksoft:#173528; --bad:#ff6b6b; --badsoft:#3d1f22; --warn:#e6b450; --warnsoft:#3a2f18;
  --en:#6aa8f0; --ensoft:#1c2c40; --ett:#e3b440; --ettsoft:#3a3016;
  --sF:#4a2233; --sFi:#ffc9da; --sV:#e0527d; --sVi:#1a0d12; --sS:#1f3350; --sSi:#b8d6ff;
  --sN:#33284d; --sNi:#d8c8ff; --sV2:#4a3914; --sV2i:#ffe0a3; --sO:#1d3b2a; --sOi:#b4ecc9; --sP:#33333b; --sPi:#dadae2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 "Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
a{color:var(--brand)}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 120px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top h1{font-size:22px;margin:0;font-weight:900;letter-spacing:-.01em;flex:1;display:flex;align-items:center;gap:10px;cursor:pointer}
.logo{width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:900}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:15px;white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;font-size:18px}
.iconbtn:hover{border-color:var(--brand)}
h2{font-size:26px;margin:6px 0 4px;letter-spacing:-.01em;font-weight:900}
h3{font-size:19px;margin:0 0 8px;font-weight:800}
.mute{color:var(--mute)}
.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
@media (max-width:420px){.g2{grid-template-columns:1fr}}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 20px;font-weight:800;background:var(--brand);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 0 var(--line)}
.btn.ok{background:var(--ok)}
.btn.big{padding:16px 26px;font-size:19px;border-radius:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:linear-gradient(0deg,var(--card),var(--card));border-left:6px solid var(--brand)}
.hero .num{font-size:44px;font-weight:900;line-height:1;color:var(--brand)}
@media (max-width:640px){.hero{grid-template-columns:1fr}}

/* lesson cards */
.lcard{position:relative;cursor:pointer;display:flex;gap:14px;align-items:center;transition:transform .12s,border-color .12s}
.lcard:hover{transform:translateY(-3px);border-color:var(--brand)}
.lnum{width:52px;height:52px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900;font-size:24px;flex:none}
.lcard .t{font-weight:900;font-size:18px;line-height:1.2}
.lcard .d{font-size:14px;color:var(--mute);line-height:1.35;margin-top:3px}
.stars{font-size:15px;letter-spacing:2px;margin-top:6px}
.stars .off{opacity:.22;filter:grayscale(1)}
.ring{flex:none}
.ring text{font-weight:900;fill:var(--ink)}

/* tools */
.tool{cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 16px}
.tool:hover{border-color:var(--brand)}
.tool .ic{font-size:28px}
.tool b{display:block;font-size:16px}
.tool span{font-size:13.5px;color:var(--mute);line-height:1.3;display:block}

/* heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--card2);display:block}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--ok) 30%,var(--card2))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--ok) 55%,var(--card2))}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--ok) 80%,var(--card2))}
.heat i[data-l="4"]{background:var(--ok)}
.heat i.today{outline:2px solid var(--brand);outline-offset:1px}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--card2);padding:5px;border-radius:14px;margin:12px 0 18px;width:max-content;max-width:100%}
.tabs button{border:0;background:transparent;padding:9px 18px;border-radius:10px;font-weight:800;color:var(--mute)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* level rows */
.level{margin-bottom:22px}
.lvhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lvbadge{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.lv1{background:var(--oksoft);color:var(--ok)}
.lv2{background:var(--warnsoft);color:var(--warn)}
.lv3{background:var(--brandsoft);color:var(--brand)}
.lv4{background:var(--ink);color:var(--bg)}
.mode{cursor:pointer;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:118px;transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--brand)}
.mode .ic{font-size:30px;line-height:1}
.mode b{font-size:16px}
.mode span{font-size:13.5px;color:var(--mute);line-height:1.3}
.mode .best{margin-top:auto;font-size:12.5px;font-weight:800;color:var(--ok)}

/* learn content */
.learn section{margin:0 0 18px}
.learn h3{display:flex;align-items:center;gap:10px}
.learn h3 .n{background:var(--brand);color:#fff;border-radius:999px;font-size:13px;padding:2px 9px}
.box{border-radius:12px;padding:12px 14px;margin:10px 0;border-left:5px solid}
.box b.h{display:block;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.box.star{background:var(--sN);border-color:#7b52c7;color:var(--ink)}
.box.hook{background:var(--brandsoft);border-color:var(--brand)}
.box.tip{background:var(--warnsoft);border-color:var(--warn)}
.box.info{background:var(--ensoft);border-color:var(--en)}
.box.ok{background:var(--oksoft);border-color:var(--ok)}
.sv{color:var(--brand);font-weight:800;cursor:pointer;border-bottom:2px dotted color-mix(in srgb,var(--brand) 45%,transparent)}
.sv:hover{background:var(--brandsoft)}
.say-hint{font-size:13px;color:var(--mute)}
table.t{width:100%;border-collapse:collapse;font-size:15.5px;margin:8px 0}
table.t th{background:var(--brand);color:#fff;text-align:left;padding:8px 10px;font-weight:800}
table.t th:first-child{border-top-left-radius:10px}table.t th:last-child{border-top-right-radius:10px}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:nth-child(even) td{background:color-mix(in srgb,var(--card2) 55%,transparent)}
.tscroll{overflow-x:auto}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pairs>div{background:var(--card2);border-radius:10px;padding:8px 12px}
.ex{display:flex;justify-content:space-between;gap:12px;padding:7px 2px;border-bottom:1px dashed var(--line)}
.ex i{color:var(--mute);text-align:right}
@media (max-width:560px){.ex{flex-direction:column;gap:0}.ex i{text-align:left}}

/* vowel tiles */
.vowels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.vowel{background:var(--card2);border-radius:14px;padding:12px;text-align:center;cursor:pointer;border:2px solid transparent;position:relative}
.vowel:hover{border-color:var(--brand)}
.vowel .L{font-size:44px;font-weight:900;color:var(--brand);line-height:1.1}
.vowel .m{font-size:13.5px}
.vowel .w{font-size:13.5px;color:var(--mute)}
.vowel .lips{position:absolute;top:6px;right:8px;font-size:18px}

/* sentence slots */
.slots{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.slot{display:flex;flex-direction:column;align-items:center;gap:2px}
.slot .w{padding:8px 12px;border-radius:10px;font-weight:800;font-size:17px;white-space:nowrap}
.slot .lab{font-size:10.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.r-F .w{background:var(--sF);color:var(--sFi)} .r-V .w{background:var(--sV);color:var(--sVi)}
.r-S .w{background:var(--sS);color:var(--sSi)} .r-N .w{background:var(--sN);color:var(--sNi)}
.r-V2 .w{background:var(--sV2);color:var(--sV2i)} .r-O .w{background:var(--sO);color:var(--sOi)}
.r-P .w{background:var(--sP);color:var(--sPi)}
.slotline{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.slotline .en{color:var(--mute);font-style:italic;font-size:14.5px;margin-left:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend .slot .w{padding:4px 10px;font-size:13px}
.flipdemo{transition:opacity .25s}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 11px;border-radius:999px;background:var(--card2);font-weight:700;font-size:14.5px;cursor:pointer}
.chip.ett{background:var(--ettsoft);color:var(--ett)}
.chip.en{background:var(--ensoft);color:var(--en)}
.bar75{display:flex;border-radius:10px;overflow:hidden;font-weight:900;color:#fff;font-size:14px;margin:8px 0}
.bar75 div{padding:8px 12px}

/* vocab list */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.vitem{background:var(--card2);border-radius:12px;padding:9px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;border:2px solid transparent}
.vitem:hover{border-color:var(--brand)}
.vitem .e{font-size:24px;width:30px;text-align:center;flex:none}
.vitem .s{font-weight:800;line-height:1.2}
.vitem .m{font-size:13.5px;color:var(--mute);line-height:1.2}
.hideen .vitem .m{filter:blur(5px)}
.hideen .vitem:hover .m{filter:none}
.lvdot{width:8px;height:8px;border-radius:50%;flex:none;margin-left:auto;background:var(--line)}
.lvdot[data-b="1"],.lvdot[data-b="2"]{background:var(--warn)}
.lvdot[data-b="3"],.lvdot[data-b="4"]{background:color-mix(in srgb,var(--ok) 60%,var(--warn))}
.lvdot[data-b="5"],.lvdot[data-b="6"]{background:var(--ok)}

/* session */
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.segs{flex:1;display:flex;gap:3px;height:12px}
.segs i{flex:1;border-radius:6px;background:var(--card2)}
.segs i.ok{background:var(--ok)} .segs i.bad{background:var(--bad)} .segs i.cur{background:var(--brand2);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}
.stage{max-width:720px;margin:0 auto}
.qtype{font-size:12.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin-bottom:6px}
.prompt{font-size:28px;font-weight:900;line-height:1.25;margin:0 0 6px}
.prompt .emo{font-size:54px;display:block;line-height:1.1;margin-bottom:6px}
.sub{color:var(--mute);margin-bottom:18px}
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:15px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:18px;box-shadow:0 3px 0 var(--line);transition:transform .06s}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt:active{transform:translateY(2px)}
.opt .k{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--mute);flex:none}
.opt.right{border-color:var(--ok);background:var(--oksoft);box-shadow:0 3px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badsoft);box-shadow:0 3px 0 var(--bad);animation:shake .35s}
.opt:disabled{cursor:default}
.opts.binary{grid-template-columns:1fr 1fr}
.opts.binary .opt{justify-content:center;font-size:30px;padding:26px}
.opt.enb{color:var(--en)} .opt.ettb{color:var(--ett)}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.gap{display:inline-block;min-width:90px;border-bottom:3px solid var(--brand);text-align:center;color:var(--brand);padding:0 6px}
.gap.filled{border-color:var(--ok);color:var(--ok);animation:pop .3s}
.sentence{font-size:26px;font-weight:800;line-height:1.5;margin:4px 0 20px}

/* audio button */
.play{width:96px;height:96px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:40px;box-shadow:0 5px 0 rgba(0,0,0,.2);margin:6px auto 12px;display:grid;place-items:center}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.say{border:0;background:var(--brandsoft);color:var(--brand);border-radius:10px;padding:4px 9px;font-size:16px;vertical-align:middle}
.no-voice .say,.no-voice .needs-voice{display:none!important}

/* input */
.inp{width:100%;font-size:24px;font-weight:800;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);outline:none}
.inp:focus{border-color:var(--brand)}
.inp.right{border-color:var(--ok);background:var(--oksoft)} .inp.wrong{border-color:var(--bad);background:var(--badsoft);animation:shake .35s}
.keys{display:flex;gap:8px;margin:10px 0}
.keys button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:48px;height:44px;font-size:20px;font-weight:900}
.keys button:hover{border-color:var(--brand)}
.diff span{padding:1px 4px;border-radius:5px;margin-right:3px;display:inline-block}
.diff .g{background:var(--oksoft);color:var(--ok)} .diff .x{background:var(--badsoft);color:var(--bad);text-decoration:line-through} .diff .m{background:var(--warnsoft);color:var(--warn)}

/* flash */
.flash{perspective:1200px;height:300px;cursor:pointer;margin-bottom:18px}
.flash .inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.flipped .inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow)}
.flash .back{transform:rotateY(180deg);border-color:var(--brand)}
.flash .emo{font-size:70px;line-height:1.1}
.flash .word{font-size:34px;font-weight:900;line-height:1.2}
.flash .ex2{margin-top:10px;color:var(--mute);font-size:15px}
.gtag{font-size:13px;font-weight:900;padding:3px 10px;border-radius:999px;margin-top:8px}
.gtag.en{background:var(--ensoft);color:var(--en)} .gtag.ett{background:var(--ettsoft);color:var(--ett)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;font-weight:900;box-shadow:0 3px 0 var(--line)}
.rate button small{display:block;font-weight:700;color:var(--mute);font-size:12px}
.rate .r0{color:var(--bad)} .rate .r1{color:var(--warn)} .rate .r2{color:var(--ok)} .rate .r3{color:var(--en)}

/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mt{padding:14px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:17px;box-shadow:0 3px 0 var(--line);min-height:58px}
.mt.sel{border-color:var(--brand);background:var(--brandsoft)}
.mt.done{border-color:var(--ok);background:var(--oksoft);opacity:.45;pointer-events:none;animation:pop .3s}
.mt.no{border-color:var(--bad);background:var(--badsoft);animation:shake .35s}

/* sort */
.buckets{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-top:16px}
.bucket{border:2px dashed var(--line);border-radius:16px;padding:10px;min-height:150px;background:var(--card);display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:border-color .15s,transform .1s}
.bucket:hover{border-color:var(--brand);transform:translateY(-2px)}
.bucket .bh{font-weight:900;text-align:center;padding:8px;border-radius:10px;font-size:16px}
.bucket .bh small{display:block;font-weight:700;font-size:12px;opacity:.8}
.bucket .in{font-size:13.5px;padding:3px 8px;border-radius:8px;background:var(--card2);animation:pop .25s}
.bucket.hint{border-color:var(--ok);border-style:solid;background:var(--oksoft)}
.bucket.nope{border-color:var(--bad);animation:shake .35s}

function parseChunks(str){
  return str.split(' / ').map(c=>{c=c.trim();const i=c.lastIndexOf(':');return {t:c.slice(0,i),r:c.slice(i+1)}});
}
function slotsHTML(chunks,labels=true){
  return `<div class="slots">${chunks.map(c=>`<div class="slot r-${c.r}"><span class="w">${esc(c.t)}</span>${labels?`<span class="lab">${ROLE[c.r]}</span>`:''}</div>`).join('')}</div>`;
}
function SL(str,en,punct='.'){
  const ch=parseChunks(str); const txt=ch.map(c=>c.t).join(' ')+punct;
  return `<div class="slotline">${slotsHTML(ch)}<button class="say" data-say="${esc(txt)}" title="Listen">🔊</button><span class="en">${esc(en)}</span></div>`;
}
const S_=t=>`<b class="sv">${esc(t)}</b>`;
function EX(sv,en){return `<div class="ex"><span>${S_(sv)}</span><i>${esc(en)}</i></div>`}
function BOX(kind,head,body){return `<div class="box ${kind}"><b class="h">${head}</b>${body}</div>`}
function SEC(n,title,body){return `<section class="card"><h3><span class="n">${n}</span>${title}</h3>${body}</section>`}
function legendHTML(){return `<div class="legend">${Object.keys(ROLE).map(r=>`<div class="slot r-${r}"><span class="w">${ROLE[r]}</span></div>`).join('')}</div>`}

'use strict';
/* ================= UTILITIES ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const sample=(a,n)=>shuffle(a).slice(0,n);
const uniq=a=>[...new Set(a)];
const dayNum=(d=new Date())=>Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5);
const norm=s=>String(s).toLowerCase().replace(/[.,!?"“”'’…:;()]/g,' ').replace(/\s+/g,' ').trim();
const deacc=s=>s.replace(/[åä]/g,'a').replace(/ö/g,'o').replace(/é/g,'e');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function toast(msg,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}

function rec(key,res){ /* res: 0 wrong · 1 hard/hinted · 2 good · 3 easy */
  if(!key)return;const t=dayNum();const it=S.items[key]||(S.items[key]={b:0,d:t,r:0,w:0});
  if(res===0){it.w++;it.b=Math.max(0,it.b-2);it.d=t}
  else{it.r++;if(res===1){it.d=t+1}else{it.b=Math.min(6,it.b+(res===3?2:1));it.d=t+IV[it.b]}}
  it.t=t;S.days[t]=(S.days[t]||0)+1;S.xp+=res?10:3;
}

/* ================= QUESTION FACTORIES ================= */
function distract(v,field,n=3){
  const pool=VOCAB.filter(x=>x!==v&&x[field]!==v[field]&&norm(x.en)!==norm(v.en));
  const same=shuffle(pool.filter(x=>x.l===v.l&&(!!x.g)===(!!v.g)));const rest=shuffle(pool.filter(x=>x.l===v.l));const all=shuffle(pool);
  return uniq([...same,...rest,...all].map(x=>x[field])).filter(x=>norm(x)!==norm(v[field])).slice(0,n);
}
const Q={
  flash:v=>({type:'flash',key:v.key,v}),
  pick:(v,dir)=>{dir=dir||pick(['sv','en']);return dir==='sv'
    ?{type:'mc',key:v.key,tag:'What does it mean?',prompt:`${esc(v.sv)} <button class="say" data-say="${esc(v.sv)}">🔊</button>`,a:v.en,o:distract(v,'en'),say:v.sv,after:`${v.e} ${esc(v.sv)} = ${esc(v.en)}`,sayFirst:true}
    :{type:'mc',key:v.key,tag:'How do you say it in Swedish?',prompt:`<span class="emo">${v.e}</span>${esc(v.en)}`,a:v.sv,o:distract(v,'sv'),say:v.sv,after:`${v.e} ${esc(v.en)} = ${esc(v.sv)}`}},
  listen:v=>({type:'mc',key:v.key,tag:'Listen — what does it mean?',audio:v.sv,prompt:'',a:v.en,o:distract(v,'en'),say:v.sv,after:`${v.e} ${esc(v.sv)} = ${esc(v.en)}`}),
  type:v=>{const answers=v.sv.split(' / ').map(s=>s.replace(/…/g,'').trim());return {type:'input',key:v.key,tag:'Type it in Swedish',prompt:`<span class="emo">${v.e}</span>${esc(v.en)}`,answers,bare:v.g?answers.map(a=>a.replace(/^(en|ett) /,'')):[],g:v.g,say:answers[0],hintText:answers[0],why:v.g?`Learn it with its little word: <b>${esc(answers[0])}</b>`:''}},
  cloze:c=>({type:'mc',key:c.key,tag:'Fill the gap',gap:c.q,a:c.a,o:c.o,en:c.en,why:c.why,say:c.q.replace('___',c.a).replace(/\s*\(.*?\)\s*/g,' ')}),
  sound:(s,i)=>{const sayBtn=/[\/·]/.test(s.w)||s.w.length<2?'':` <button class="say" data-say="${esc(s.w)}">🔊</button>`;
    const prompt=s.q.endsWith('?')?`${esc(s.q)}<div style="color:var(--brand);font-size:34px;margin-top:6px">${esc(s.w)}${sayBtn}</div>`:`${esc(s.q)} <span style="color:var(--brand)">${esc(s.w)}</span>?${sayBtn}`;
    return {type:'mc',key:'p:'+i,tag:'Sound detective',prompt,a:s.a,o:s.o,why:s.why,say:/[\/]/.test(s.w)?s.a:(s.w.length<2||s.w.includes('·')?null:s.w)}},
  sortone:it=>{const b=it.set.b;return {type:'mc',key:it.key,tag:it.set.t,prompt:esc(it.t),a:b.find(x=>x[0]===it.b)[1],o:b.filter(x=>x[0]!==it.b).map(x=>x[1]),binary:b.length===2,say:sortSay(it)}},
  build:s=>({type:'build',key:s.key,s}),
  translate:s=>({type:'input',key:s.key,tag:'Write it in Swedish',prompt:esc(s.en),answers:[s.sv,...s.alts],long:true,say:s.sv+s.punct,s,why:`<div>${slotsHTML(s.chunks)}</div>`}),
  verb3:v=>({type:'verb',key:'vb3:'+v.pres,v,ask:['imp','inf']}),
  verb6:v=>({type:'verb',key:'vb6:'+v.pres,v,ask:['past']}),
  form:f=>{switch(f.kind){
    case 'gender':return {type:'mc',key:f.key,tag:'EN or ETT?',prompt:`<span style="font-size:40px">${esc(f.w)}</span>`,a:f.g,o:[f.g==='en'?'ett':'en'],binary:true,genderBtns:true,say:`${f.g} ${f.w}`,after:`<b>${f.g} ${esc(f.w)}</b>`,why:f.g==='ett'?'It\'s on the ETT list.':(/bok|kurs/.test(f.w)&&f.w.length>5?'Compound: the LAST word decides.':'Most words are EN (≈75%).')};

      return {type:'mc',key:f.key,tag:'Adjective agreement',gap:`${f.g} ___ ${f.w} (${a[0]})`,a:t?a[1]:a[0],o:[t?a[0]:a[1]],en:`a ${a[2]} ${f.w}`,why:t?'ETT-word → adjective + t.':'EN-word → nothing happens to the adjective.',say:`${f.g} ${t?a[1]:a[0]} ${f.w}`}}
    case 'this':{const far=Math.random()<.5;return {type:'mc',key:f.key,tag:'this / that',gap:`___ ${far?'där':'här'} ${f.d}`,a:f.g==='ett'?'det':'den',o:[f.g==='ett'?'den':'det','de'],en:`${far?'that':'this'} ${f.w}`,why:`${f.w} is an ${f.g.toUpperCase()}-word → ${f.g==='ett'?'det':'den'} ${far?'där':'här'} + definite noun.`,say:`${f.g==='ett'?'det':'den'} ${far?'där':'här'} ${f.d}`}}
    case 'gen':return {type:'input',key:f.key,tag:'Genitive',prompt:`${esc(f.en)} → ___ ${esc(f.w)}`,answers:[f.n+'s '+f.w,f.n+'s'],say:f.n+'s '+f.w,why:'Just add -s, no apostrophe!'};

  translate:{lv:3,ic:'✍️',n:'Write the sentence',d:'Translate a full sentence',kind:'s'},
  mix:{lv:4,ic:'👑',n:'Boss round',d:'Everything mixed + earlier lessons',kind:'*'}
};
const LVNAME={1:'Level 1 · See & recognise',2:'Level 2 · Recall',3:'Level 3 · Build & produce',4:'Mastery'};
function modesFor(l){return Object.keys(MODES).filter(m=>{const M=MODES[m];if(M.kind==='*')return true;
  if(M.kind==='vb')return VERBS.some(v=>(l===3&&v.l===3)||l===6);return CATALOG.some(c=>c.l===l&&c.kind===M.kind)})}
function lessonItems(l){return CATALOG.filter(c=>c.l===l)}
function mastery(l){const it=lessonItems(l);if(!it.length)return 0;return it.reduce((s,c)=>s+Math.min(box(c.key),4),0)/(it.length*4)}

function buildQs(mode,l){
  const byKind=k=>prioritize(CATALOG.filter(c=>c.l===l&&c.kind===k));
  const V=()=>byKind('v').map(c=>c.ref);
  switch(mode){
    case 'cards':return V().slice(0,10).map(Q.flash);
    case 'pick':return V().slice(0,10).map(v=>Q.pick(v));
    case 'listen':return V().slice(0,10).map(Q.listen);
    case 'type':return V().slice(0,10).map(Q.type);
    case 'match':{const v=V().slice(0,18);const r=[];for(let i=0;i<v.length;i+=6){const g=v.slice(i,i+6);if(g.length>=3)r.push({type:'match',pairs:g})}return r}
    case 'sound':return byKind('p').slice(0,10).map(c=>c.make());
    case 'gap':return byKind('c').slice(0,10).map(c=>c.make());
    case 'sort':{const sets=SORTS.filter(s=>s.l===l);return shuffle(sets).slice(0,2).map(s=>({type:'sort',set:s,items:prioritize(SORTITEMS.filter(x=>x.set===s)).slice(0,8)}))}
    case 'forms':return byKind('f').slice(0,10).map(c=>c.make());
    case 'build':return byKind('s').slice(0,8).map(c=>Q.build(c.ref));
    case 'translate':return byKind('s').slice(0,6).map(c=>Q.translate(c.ref));
    case 'verbs':return l===3?byKind('vb3').slice(0,8).map(c=>c.make()):byKind('vb6').slice(0,8).map(c=>c.make());
    case 'mix':{const old=prioritize(CATALOG.filter(c=>c.l<l)).slice(0,l>1?3:0);const own=prioritize(lessonItems(l)).slice(0,10-old.length);return shuffle([...own,...old]).map(c=>c.make())}
  }return [];
}

function ring(p,size=64,stroke=7,label){const r=(size-stroke)/2,c=2*Math.PI*r;return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${Math.round(p*100)}% mastered"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--card2)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p>=.8?'var(--ok)':'var(--brand)'}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-size="${size/4.2}">${label??Math.round(p*100)+'%'}</text></svg>`}
function starRow(l){const s=S.stars[l]||{};return `<div class="stars">${[1,2,3].map(i=>`<span class="${s[i]?'':'off'}">⭐</span>`).join('')}<span class="${s[4]?'':'off'}">👑</span></div>`}
function dueKeys(){const t=dayNum();return Object.keys(S.items).filter(k=>BYKEY.has(k)&&S.items[k].d<=t).sort((a,b)=>S.items[a].d-S.items[b].d)}

function drawFlip(){const fd=$('#flipdemo');if(!fd)return;const pair=FLIPDEMO[+fd.dataset.i];fd.style.opacity=0;setTimeout(()=>{fd.innerHTML=slotsHTML(parseChunks(pair[+fd.dataset.s]));fd.style.opacity=1},160)}

/* ================= SESSION ENGINE ================= */
let SES=null;
function startSession(qs,meta){qs=qs.filter(Boolean);if(!qs.length){toast('Nothing to practise here yet.');return}
  SES={qs,i:0,res:[],meta,missed:[],first:qs.length};go('session')}
function vSession(){if(!SES){go('home');return}if(SES.i>=SES.qs.length){go('summary');return}
  const q=SES.qs[SES.i];
  app().innerHTML=`<div class="sbar"><button class="iconbtn" data-act="quit" title="Stop">✕</button><div class="segs">${SES.qs.map((x,i)=>`<i class="${i<SES.i?(SES.res[i]?'ok':'bad'):i===SES.i?'cur':''}"></i>`).join('')}</div><span class="pill">${SES.meta.title}</span></div><div class="stage" id="stage"></div>`;
  const host=$('#stage');R[q.type](q,host,(res,info)=>answered(res,info||{}));
}
function answered(res,info){
  const q=SES.qs[SES.i];if(q.done)return;q.done=true;
  if(!info.recorded)rec(q.key,res);
  SES.res[SES.i]=res>0;
  if(res===0){SES.missed.push(q);if(!q.retry&&q.type!=='match'&&q.type!=='sort'&&SES.qs.filter(x=>x.retry).length<3){const c=Object.assign({},q,{retry:true,done:false});SES.qs.splice(Math.min(SES.i+3,SES.qs.length),0,c)}}
  save();
  if(info.silent){nextQ();return}
  showFb(res>0,info);
}
function nextQ(){if(!SES||SES.adv===SES.i)return;SES.adv=SES.i;hideFb();SES.i++;if(SES.i>=SES.qs.length)finish();else vSession()}
let FBTOK=0;
function showFb(ok,info){
  let fb=$('#fb');if(!fb){fb=document.createElement('div');fb.id='fb';fb.className='fb';document.body.appendChild(fb)}
  fb.className='fb '+(ok?'good':'bad');
  fb.innerHTML=`<div class="in"><div class="msg"><div class="ttl">${ok?(info.title||'✅ '+pick(PRAISE)):(info.title||'❌ Not quite')}</div>
   ${info.ans?`<div class="ans">${info.ans} ${info.say?`<button class="say" data-say="${esc(info.say)}">🔊</button>`:''}</div>`:''}${info.why?`<div class="why">${info.why}</div>`:''}</div>
   <button class="btn" data-act="next" id="nextbtn">Continue ⏎</button></div>`;
  const tok=++FBTOK;requestAnimationFrame(()=>{if(tok===FBTOK&&VIEW.name==='session')fb.classList.add('show')});
  setTimeout(()=>{const b=$('#nextbtn');b&&b.focus()},60);
  if(info.say)autoSay(info.say);
}
function hideFb(){FBTOK++;const fb=$('#fb');if(fb)fb.classList.remove('show')}
function finish(){
  const scored=SES.qs.filter(q=>!q.retry);const idx=SES.qs.map((q,i)=>i).filter(i=>!SES.qs[i].retry);
  const right=idx.filter(i=>SES.res[i]).length;const pct=Math.round(right/scored.length*100);
  const m=SES.meta;if(m.l&&m.mode){const k=m.l+':'+m.mode;S.best[k]=Math.max(S.best[k]||0,pct);if(pct>=80){(S.stars[m.l]=S.stars[m.l]||{})[MODES[m.mode].lv]=true}}
  SES.pct=pct;SES.right=right;SES.total=scored.length;save();go('summary');if(pct>=80)confetti();
}
function vSummary(){if(!SES){go('home');return}
  const m=SES.meta;const missed=dedupeMissed();
  app().innerHTML=`${topbar()}<div class="stage"><div class="card" style="text-align:center">
   <div class="qtype">${m.title}</div><div class="score" style="color:${SES.pct>=80?'var(--ok)':SES.pct>=50?'var(--warn)':'var(--bad)'}">${SES.pct}%</div>
   <div class="mute">${SES.right} of ${SES.total} right first time${SES.pct>=80?' · ⭐ level star earned!':''}</div>
   <p style="font-size:20px;font-weight:800">${SES.pct>=90?'Fantastiskt! 🏆':SES.pct>=80?'Bra jobbat! 💪':SES.pct>=50?'Good progress — the misses will come back in review.':'Keep going — repetition is how it sticks. 🌱'}</p>
   <div class="row" style="justify-content:center">${missed.length?`<button class="btn" data-act="retrymissed">🔁 Practise my ${missed.length} mistake${missed.length>1?'s':''}</button>`:''}<button class="btn ghost" data-act="again">▶ Play again</button>${m.l?`<button class="btn ghost" data-act="lesson" data-l="${m.l}">Back to Lesson ${m.l}</button>`:`<button class="btn ghost" data-act="home">Home</button>`}</div></div>
   ${missed.length?`<div class="card" style="margin-top:14px"><h3>To remember</h3><div class="missed">${missed.map(q=>`<div><span>${missLabel(q)}</span></div>`).join('')}</div></div>`:''}</div>`;
}
function strip(h){const d=document.createElement('div');d.innerHTML=h.replace(/<span class="emo">.*?<\/span>/,'').replace(/<button.*?<\/button>/g,'');return esc(d.textContent.trim())}
function missLabel(q){
  if(q.v&&q.type==='flash')return `${q.v.e} <b>${esc(q.v.sv)}</b> = ${esc(q.v.en)}`;
  if(q.type==='build')return `<b>${esc(q.s.sv+q.s.punct)}</b> <span class="mute">${esc(q.s.en)}</span>`;
  if(q.type==='match')return (q.bad||[]).map(k=>{const v=BYKEY.get(k).ref;return `${v.e} <b>${esc(v.sv)}</b> = ${esc(v.en)}`}).join('<br>');
  if(q.type==='sort')return (q.bad||[]).map(k=>{const it=BYKEY.get(k).ref;return `${esc(it.t)} → <b>${esc(it.set.b.find(x=>x[0]===it.b)[1])}</b>`}).join('<br>');
  if(q.type==='verb')return `<b>${esc(q.v.pres)}</b> → ${esc(q.v.imp)}! → ${esc(q.v.inf)} → ${esc(q.v.past)}`;
  if(q.type==='input')return `${strip(q.prompt)} → <b>${esc(q.answers[0])}</b>`;
  if(q.type==='mc'&&q.after)return q.after;
  if(q.type==='mc')return q.gap?`<b>${esc(q.gap.replace('___',q.a))}</b>`:`${strip(q.prompt)} → <b>${esc(q.a)}</b>`;
  return '';
}

function dedupeMissed(){const seenK=new Set();return SES.missed.filter(q=>{const k=q.key||q;if(seenK.has(k))return false;seenK.add(k);return true})}
const EN_SETS=new Set(['qw','help','hinorka','frisk','snall','kud','adj3']);
function sortSay(it){const id=it.set.id;if(EN_SETS.has(id))return null;if(id==='enett')return it.b+' '+it.t;if(id==='fritid'||id==='plural'||id==='past'||id==='long'||id==='soft'||id==='pron'||id==='vgroup'||id==='mood')return it.t;
  return it.t.replace(/\(.*?\)/g,'').replace(/___/g,it.b).trim()}
/* ================= RENDERERS ================= */
const R={};
const KEYS=['1','2','3','4','5','6'];
R.mc=(q,host,done)=>{

   ${q.prompt?`<div class="prompt">${q.prompt}</div><div class="sub"></div>`:''}${gapHtml}
   <div class="opts ${q.binary?'binary':''}">${opts.map((o,i)=>`<button class="opt ${q.genderBtns?(o==='en'?'enb':'ettb'):''}" data-i="${i}">${q.binary?'':`<span class="k">${i+1}</span>`}${esc(o)}</button>`).join('')}</div>`;

    done(ok?2:0,{ans:q.after||(q.gap?esc(q.gap.replace('___',q.a)):`<b>${esc(q.a)}</b>`),why:q.why||'',say:q.say});
  });
};
R.flash=(q,host,done)=>{
  const v=q.v;const rev=box(v.key)>=2&&Math.random()<.5; /* known words: sometimes English first */
  const front=rev?`<div class="emo">${v.e}</div><div class="word">${esc(v.en)}</div><div class="mute small" style="margin-top:8px">Say it in Swedish, then flip</div>`
                 :`<div class="emo">${v.e}</div><div class="word">${esc(v.sv)}</div><div class="mute small" style="margin-top:8px">What does it mean? Think, then flip</div>`;
  const back=`<div class="emo">${v.e}</div><div class="word" style="color:var(--brand)">${esc(v.sv)}</div><div style="font-size:21px;font-weight:700;margin-top:4px">${esc(v.en)}</div>${v.g?`<span class="gtag ${v.g}">${v.g.toUpperCase()}-word</span>`:''}<div style="margin-top:10px"><button class="say" data-say="${esc(v.sv.split(' / ')[0])}">🔊 Listen</button></div>`;
  host.innerHTML=`<div class="qtype">Flashcard${seen(v.key)?'':' · NEW'}</div><div class="flash" id="fl"><div class="inner"><div class="face">${front}</div><div class="face back">${back}</div></div></div>
   <div id="fa"><button class="btn big" style="width:100%" id="flipbtn">Flip card <span class="kbd">space</span></button></div>`;
  const fl=$('#fl',host);let flipped=false;

function wordDiff(user,target){ /* LCS on words → coloured */
  const a=norm(user).split(' ').filter(Boolean),b=norm(target).split(' ').filter(Boolean);
  const L=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));
  for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0;const out=[];while(i<a.length&&j<b.length){if(a[i]===b[j]){out.push(`<span class="g">${esc(b[j])}</span>`);i++;j++}else if(L[i+1][j]>=L[i][j+1]){out.push(`<span class="x">${esc(a[i])}</span>`);i++}else{out.push(`<span class="m">${esc(b[j])}</span>`);j++}}
  while(i<a.length)out.push(`<span class="x">${esc(a[i++])}</span>`);while(j<b.length)out.push(`<span class="m">${esc(b[j++])}</span>`);
  return `<div class="diff">${out.join('')}</div><div class="small mute" style="margin-top:4px"><span class="diff"><span class="g">right</span><span class="x">remove</span><span class="m">missing</span></span></div>`;
}

function nextSpeed(){const v=pick(SP.pool);const truth=Math.random()<.5;const m=truth?v.en:pick(SP.pool.filter(x=>x.en!==v.en)).en;SP.cur={v,truth,m};
  $('#scard').innerHTML=`<div class="w">${esc(v.sv)}</div><div class="eq">=</div><div class="m">${esc(m)}</div>`}
function answerSpeed(yes){if(!SP||!SP.timer)return;const ok=(yes===SP.cur.truth);const c=$('#scard');c.classList.remove('flashok','flashbad');void c.offsetWidth;c.classList.add(ok?'flashok':'flashbad');
  if(ok)SP.score++;else{SP.wrong++;rec(SP.cur.v.key,0);toast(`${SP.cur.v.sv} = ${SP.cur.v.en}`,1500)}$('#sc').textContent=SP.score;$('#wr').textContent=SP.wrong;nextSpeed()}
function endSpeed(){stopSpeed();const best=SP.score>S.speed;if(best)S.speed=SP.score;const t=dayNum();S.days[t]=(S.days[t]||0)+SP.score+SP.wrong;S.xp+=SP.score*2;save();if(best)confetti();
  $('.stage').innerHTML=`<div class="card" style="text-align:center"><div class="qtype">Speed round</div><div class="score">${SP.score}</div><div class="mute">right answers · ${SP.wrong} wrong</div><p style="font-weight:800;font-size:20px">${best?'🏆 New record!':'Best: '+S.speed}</p><div class="row" style="justify-content:center"><button class="btn" data-act="nav" data-v="speed">Again</button><button class="btn ghost" data-act="home">Home</button></div></div>`;SP=null}

function confetti(){const c=document.createElement('div');c.className='confetti';const cols=['#9b1f45','#2f6fb5','#b8860b','#23845a','#c2335f','#7b52c7'];
  for(let i=0;i<90;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=pick(cols);p.style.animationDuration=(1.6+Math.random()*1.8)+'s';p.style.animationDelay=Math.random()*.5+'s';p.style.transform=`rotate(${Math.random()*360}deg)`;c.appendChild(p)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),4200)}

/* ================= EVENTS ================= */
function startMode(l,m){const qs=buildQs(m,l);const nm=m==='forms'&&l===4?'EN or ETT?':MODES[m].n;startSession(qs,{l,mode:m,title:`L${l} · ${nm}`})}
function startReview(){const due=dueKeys().slice(0,20).map(k=>BYKEY.get(k).make());
  if(due.length<6){const nl=nextLesson();const fresh=prioritize(VOCAB.filter(v=>v.l===nl&&!seen(v.key))).slice(0,8-Math.min(due.length,5)).map(Q.flash);due.push(...fresh)}
  startSession(shuffle(due),{title:'Daily review'})}
document.addEventListener('click',e=>{
  const sayEl=e.target.closest('[data-say]');if(sayEl&&!e.target.closest('[data-act]')){Speech.say(sayEl.dataset.say);if(sayEl.classList.contains('say')||sayEl.classList.contains('play'))return}
  const slow=e.target.closest('[data-slow]');if(slow){Speech.say(slow.dataset.slow,.55);return}
  const svEl=e.target.closest('.sv');if(svEl&&!svEl.dataset.say){Speech.say(svEl.textContent);return}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  switch(act){
    case 'home':go('home');break;
    case 'lesson':go('lesson',{l:+a.dataset.l,tab:VIEW.name==='lesson'?VIEW.tab:(mastery(+a.dataset.l)===0?'learn':'practice')});break;
    case 'tab':go('lesson',{l:VIEW.l,tab:a.dataset.t});break;
    case 'play':startMode(VIEW.l,a.dataset.m);break;
    case 'review':startReview();break;
    case 'next':nextQ();break;
    case 'quit':if(confirmQuit())go(SES.meta.l?'lesson':'home',{l:SES.meta.l,tab:'practice'});break;
    case 'again':SES.meta.mode?startMode(SES.meta.l,SES.meta.mode):SES.meta.title==='Daily review'?startReview():startSession(shuffle(SES.qs.filter(q=>!q.retry).map(q=>Object.assign({},q,{done:false,retry:false}))),SES.meta);break;
    case 'retrymissed':{const list=dedupeMissed();const ms=list.filter(q=>q.key).map(q=>{const c=BYKEY.get(q.key);return c?c.make():Object.assign({},q,{done:false,retry:false})});
      const extra=list.filter(q=>q.type==='match').flatMap(q=>(q.bad||[]).map(k=>Q.pick(BYKEY.get(k).ref)));
      const extra2=list.filter(q=>q.type==='sort').flatMap(q=>(q.bad||[]).map(k=>Q.sortone(BYKEY.get(k).ref)));
      startSession(shuffle([...ms,...extra,...extra2]),{title:'Fix my mistakes',l:SES.meta.l});break}
    case 'nav':go(a.dataset.v);break;
    case 'theme':{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');S.theme=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;save();break}
    case 'auto':S.auto=a.checked;save();break;
    case 'hideen':$('#vlist').parentElement.classList.toggle('hideen',a.checked);break;
    case 'flipdemo':{const fd=$('#flipdemo');fd.dataset.s=+fd.dataset.s?0:1;if(fd.dataset.s==='0')fd.dataset.i=(+fd.dataset.i+1)%FLIPDEMO.length;a.textContent=fd.dataset.s==='1'?'🔄 Next example':'🔄 Move the time to the front';drawFlip();const txt=parseChunks(FLIPDEMO[+fd.dataset.i][+fd.dataset.s]).map(c=>c.t).join(' ');setTimeout(()=>autoSay(txt),200);break}
    case 'weakplay':startSession(weakKeys().slice(0,15).map(k=>BYKEY.get(k).make()),{title:'Weak spots'});break;
    case 'speedgo':speedGo();break;
    case 'tf':answerSpeed(a.dataset.v==='1');break;
    case 'export':{const blob=new Blob([JSON.stringify(S)],{type:'application/json'});const u=URL.createObjectURL(blob);const x=document.createElement('a');x.href=u;x.download=`svenska-progress-${new Date().toISOString().slice(0,10)}.json`;x.click();setTimeout(()=>URL.revokeObjectURL(u),1000);break}
    case 'import':{const f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.v!==1)throw 0;S=Object.assign(freshState(),d);save();toast('Progress imported ✓');render()}catch(err){toast('That file is not a progress export.')}};r.readAsText(f.files[0])};f.click();break}
    case 'reset':if(confirm('Delete all progress in this browser? (Export first if you want a backup.)')){S=freshState();save();render()}break;
  }
});
document.addEventListener('input',e=>{if(e.target.dataset.act==='search'){const q=e.target.value.toLowerCase().trim();$$('#vlist .vitem').forEach(el=>el.style.display=!q||el.dataset.q.includes(q)?'':'none')}});
function confirmQuit(){return !SES||SES.i===0||confirm('Stop this round? Your answers so far are saved.')}
document.addEventListener('keydown',e=>{
  if(VIEW.name==='speed'&&SP&&SP.timer){if(e.key==='ArrowLeft'){e.preventDefault();answerSpeed(false)}if(e.key==='ArrowRight'){e.preventDefault();answerSpeed(true)}return}
  if(VIEW.name!=='session'||!SES)return;const fb=$('#fb.show');
  if(fb){if(e.key==='Enter'||e.key===' '){e.preventDefault();nextQ()}return}
  if(e.target.tagName==='INPUT')return;const q=SES.qs[SES.i];
  if(q.type==='flash'){if(e.key===' '||e.key==='Enter'){e.preventDefault();q.flip&&q.flip()}const rb=$$('.rate button');if(rb.length&&KEYS.includes(e.key)&&+e.key<=4){rb[+e.key-1].click()}return}
  if(q.type==='mc'){const os=$$('.opt');if(KEYS.includes(e.key)&&os[+e.key-1]&&!os[0].disabled)os[+e.key-1].click();if(q.binary&&os.length===2&&!os[0].disabled){if(e.key==='ArrowLeft')os[0].click();if(e.key==='ArrowRight')os[1].click()}return}
  if(q.type==='sort'&&KEYS.includes(e.key)){q.choose&&q.choose(+e.key-1);return}
  if(q.type==='build'&&e.key==='Enter'){e.preventDefault();q.check&&q.check()}
});

/* ================= BOOT ================= */
if(S.theme)document.documentElement.dataset.theme=S.theme;
Speech.init();parseHash();render();
setTimeout(()=>{if(VIEW.name==='home')render()},900); /* re-render once voices load */
</script></body></html>
